<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play Clipper</title>
<style>html,body{margin:0;height:100%;background:#161615}</style>
<!-- GitHub Pages caches pages for up to 10 minutes. This tiny page always asks for the newest build number
     and opens app.html?v=<build>, so every reload gets the latest version. -->
<script>
fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
  .then(function (r) { return r.json(); })
  .then(function (j) { location.replace('app.html?v=' + j.build + location.hash); })
  .catch(function () { location.replace('app.html?v=' + Date.now() + location.hash); });
</script>
